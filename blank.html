<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>About:Blank — DuckMath</title>
    <script src="/assets/js/ab-blank.js" type="text/javascript"></script>
  </head>
<body>
<div id="contentArea">
</div>
<script>
  function loadHtmlContent() {
    fetch('index.html')
      .then(response => {
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        return response.text();
      })
      .then(html => {
        document.getElementById('contentArea').innerHTML = html;
      })
      .catch(error => {
        console.error('There has been a problem with your fetch operation:', error);
      });
  }
  loadHtmlContent()
</script>
</body>
</html>
