<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rammerhead Proxy — Fullscreen</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        #gameFrame {
            border: none;
            width: 100%;
            height: 100%;
        }
    </style>
  </head>
  <body>
    <iframe
      class="gameloc"
      id="gameFrame"
      allowfullscreen=""
      allow="autoplay; fullscreen; camera; focus-without-user-activation *; monetization; gamepad;
       keyboard-map *; xr-spatial-tracking; clipboard-write"
      name="gameFrame"
      scrolling="no"
      sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock
      allow-popups allow-popups-to-escape-sandbox allow-presentation allow-scripts allow-same-origin
      allow-downloads"
      src="https://codeacademy.gq/"
      title="Game"
    ></iframe>
  </body>
</html>
