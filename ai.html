    <div class="chat-container">
        <h1>AI Chat</h1>
        <div id="chat-box" class="chat-box">
        </div>
        <form id="chat-form" class="chat-form">
            <input type="text" id="user-input" placeholder="Type your message..." required>
            <button type="submit">Send</button>
        </form>
    </div>

    <script>
        function redirectToNewTab(url) {
          window.open(url, '_blank');
        }
        function SwitchFile(url) {
          window.location.href = url;
        }
        document.addEventListener('DOMContentLoaded', () => {
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const chatBox = document.getElementById('chat-box');

    chatForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const message = userInput.value.trim();
        if (message) {
            appendMessage(message, 'user-message');
            userInput.value = '';
            await sendToClaude(message);
        }
    });

    function appendMessage(text, className) {
        const messageElement = document.createElement('div');
        messageElement.classList.add('message', className);
        messageElement.textContent = text;
        chatBox.appendChild(messageElement);
        chatBox.scrollTop = chatBox.scrollHeight; // Scroll to bottom
    }

    async function sendToClaude(userMessage) {
        try {
            const response = await fetch('/chat', { // Assumes a backend endpoint /chat
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ message: userMessage }),
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();
            appendMessage(data.reply, 'ai-message'); // Assumes backend sends a 'reply' field
        } catch (error) {
            console.error('Error communicating with Claude:', error);
            appendMessage('Error: Could not get a response from Claude.', 'ai-message');
        }
    }
});
    </script>
